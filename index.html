<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Note That Keeps Going</title>

    <meta property="og:title" content="A note that keeps going" />
    <meta property="og:description" content="Click to keep reading." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thecameronboyer-beep.github.io/facebook-long-note-post/" />
    <meta property="og:image" content="https://thecameronboyer-beep.github.io/facebook-long-note-post/og-preview.png" />
    <meta property="og:image:secure_url" content="https://thecameronboyer-beep.github.io/facebook-long-note-post/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A notebook page with a handwritten note cut off at a cliffhanger." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A note that keeps going" />
    <meta name="twitter:description" content="Click to keep reading." />
    <meta name="twitter:image" content="https://thecameronboyer-beep.github.io/facebook-long-note-post/og-preview.png" />

    <link rel="preload" href="./full-note.png" as="image" />

    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111012;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page-stage {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background:
          linear-gradient(rgba(248, 230, 194, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(248, 230, 194, 0.035) 1px, transparent 1px),
          #0d0c0e;
        background-size: 22px 22px;
        scrollbar-color: #d7bd73 #171519;
        scrollbar-width: thin;
      }

      .note-image {
        display: block;
        width: min(100vw, 720px);
        height: auto;
        max-width: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <main class="page-stage" aria-label="Vertically scrollable notebook note">
      <img
        class="note-image"
        src="./full-note.png"
        alt="A very tall notebook page with a handwritten note that keeps going down."
      />
    </main>
  </body>
</html>
